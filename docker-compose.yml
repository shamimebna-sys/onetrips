services:
  postgres:
    image: postgres:16
    container_name: onetrips-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onetrips}
      POSTGRES_USER: ${POSTGRES_USER:-onetrips}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onetrips}
    ports:
      - "5432:5432"
    volumes:
      - onetrips_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onetrips} -d ${POSTGRES_DB:-onetrips}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: onetrips-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - onetrips_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  onetrips_postgres_data:
  onetrips_redis_data:
